services:
  db:
    image: postgres:16
    container_name: room-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: room_booking
    ports:
      - "5432:5432"
    volumes:
      - room_booking_data:/var/lib/postgresql/data

volumes:
  room_booking_data: